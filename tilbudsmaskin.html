<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quotr – tilbud og faktura på 2 minutter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{--bg:#f4f3ef;--panel:#fff;--ink:#1d2327;--mut:#6b7378;--line:#d9d8d2;--acc:#f2c230;--accink:#1d2327;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a1c;--panel:#22272a;--ink:#eceae4;--mut:#99a1a6;--line:#383e42}}
:root[data-theme="dark"]{--bg:#171a1c;--panel:#22272a;--ink:#eceae4;--mut:#99a1a6;--line:#383e42}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
header{padding:28px 20px 8px;max-width:1180px;margin:auto}
h1{font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
header p{color:var(--mut);margin:8px 0 0;max-width:56ch}
main{max-width:1180px;margin:auto;padding:16px 20px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel+.panel{margin-top:16px}
h2{font-size:18px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:10px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--accink)}
.line{display:grid;grid-template-columns:1fr 64px 70px 90px 30px;gap:6px;margin-bottom:6px}
.line input{padding:7px 8px}
.line .x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px}
@media(max-width:520px){.line{grid-template-columns:1fr 1fr 1fr 30px}.line .d{grid-column:1/-1}}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sticky{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
/* dokument */
.doc{background:#fff;color:#1d2327;border-radius:4px;border:1px solid var(--line);padding:34px 32px;font-size:14px;min-height:560px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.doc .top{display:flex;justify-content:space-between;gap:16px;border-top:6px solid var(--acc);padding-top:16px;margin-bottom:22px}
.doc h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:28px;margin:0;font-weight:800}
.doc small{color:#6b7378}
.doc table{width:100%;border-collapse:collapse;margin:14px 0}
.doc th{text-align:left;font-weight:600;color:#6b7378;font-size:12px;border-bottom:2px solid #1d2327;padding:6px 4px}
.doc td{padding:8px 4px;border-bottom:1px solid #e6e5e0;vertical-align:top}
.doc .r{text-align:right;white-space:nowrap}
.tot{margin-left:auto;width:min(280px,100%)}
.tot div{display:flex;justify-content:space-between;padding:4px 0}
.tot .big{border-top:2px solid #1d2327;margin-top:6px;padding-top:8px;font-weight:800;font-size:18px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.note{margin-top:22px;color:#4a5358;white-space:pre-wrap}
@media print{body{background:#fff}header,.edit,.bar,.hint{display:none!important}main{display:block;padding:0}.doc{border:0;padding:0;box-shadow:none}.sticky{position:static}}
.hi{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.hi span{flex:1;min-width:0}.hi small{color:var(--mut);display:block}.hi button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit;font-size:13px}
.hint{font-size:13px;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>Quotr</h1>
  <p>Skriv tilbud og faktura med riktig MVA på to minutter. Fyll inn til venstre, skriv ut eller lagre som PDF til høyre.</p>
</header>
<main>
  <div class="edit">
    <div class="panel"><h2>Lagrede dokumenter</h2><div id="hist"></div></div>
    <div class="panel">
      <div class="seg" id="seg"><button class="on" data-t="Tilbud">Tilbud</button><button data-t="Faktura">Faktura</button></div>
      <div class="row"><div><label for="nr">Nummer</label><input id="nr" value="1001"></div><div><label for="dato">Dato</label><input id="dato" type="date"></div></div>
      <label for="frist" id="fristl">Gyldig til</label><input id="frist" type="date">
    </div>
    <div class="panel">
      <h2>Din bedrift</h2>
      <label for="fnavn">Firmanavn</label><input id="fnavn" placeholder="Hansen Maling AS">
      <div class="row"><div><label for="forg">Org.nr</label><input id="forg" placeholder="123 456 789 MVA"></div><div><label for="ftlf">Telefon</label><input id="ftlf"></div></div>
      <label for="fadr">Adresse</label><input id="fadr" placeholder="Gate 1, 1234 Sted">
      <label for="fkonto">Kontonummer (faktura)</label><input id="fkonto" placeholder="1234 56 78901">
      <div class="row"><div><label for="kid">KID-nummer på faktura</label><select id="kid"><option value="nei">Nei</option><option value="ja">Ja</option></select></div><div><label for="kidm">KID-metode (spør banken)</label><select id="kidm"><option value="10">MOD10</option><option value="11">MOD11</option></select></div></div>
      <label for="logo">Logo</label><input id="logo" type="file" accept="image/*">
      <button class="btn ghost" id="nologo" type="button" style="margin-top:8px">Fjern logo</button>
    </div>
    <div class="panel">
      <h2>Kunde</h2>
      <label for="knavn">Navn</label><input id="knavn">
      <label for="kadr">Adresse</label><input id="kadr">
    </div>
    <div class="panel">
      <h2>Linjer</h2>
      <div id="lines"></div>
      <div class="bar"><button class="btn ghost" id="add">+ Ny linje</button></div>
      <div class="row"><div><label for="mva">MVA</label><select id="mva"><option value="25">25 %</option><option value="15">15 % (mat)</option><option value="12">12 %</option><option value="0">Ingen MVA</option></select></div>
      <div><label for="vis">Prisene i linjene er</label><select id="vis"><option value="eks">Uten MVA</option><option value="inkl">Med MVA</option></select></div></div>
      <label for="rabatt">Rabatt (%)</label><input id="rabatt" type="number" min="0" max="100" step="any" value="0">
      <label for="notat">Notat / vilkår</label><textarea id="notat" rows="3">Betalingsfrist 14 dager. Arbeid utføres etter avtale.</textarea>
    </div>
  </div>
  <div class="sticky">
    <div class="doc" id="doc"></div>
    <div class="bar"><button class="btn" id="print">Skriv ut / lagre som PDF</button><select id="fmt" aria-label="Filformat" style="width:auto;font-weight:600"><option value="pdf">PDF</option><option value="docx">Word (.docx)</option><option value="xlsx">Excel (.xlsx)</option><option value="csv">CSV</option><option value="html">HTML</option></select><button class="btn" id="dl">Last ned</button><button class="btn ghost" id="savedoc">Lagre dokument</button><button class="btn ghost" id="tofak">Gjør om til faktura</button><button class="btn ghost" id="newdoc">Nytt dokument</button><button class="btn ghost" id="reset">Tøm alt</button></div>
    <p class="hint" id="msg" role="status"></p>
    <p class="hint">Opplysningene lagres kun i din egen nettleser.</p>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var KEY="tilbudsmaskin-v1",HK="tilbudsmaskin-hist",type="Tilbud",logo="",lastTot=0;
var ids=["nr","dato","frist","fnavn","forg","ftlf","fadr","fkonto","knavn","kadr","mva","vis","notat","rabatt","kid","kidm"];
var lines=[{d:"Maling av stue, inkl. materialer",q:1,u:"stk",p:8500}];
var today=new Date(),d30=new Date(Date.now()+30*864e5);
function iso(d){return d.toISOString().slice(0,10)}
$("dato").value=iso(today);$("frist").value=iso(d30);
function snap(){var o={type:type,lines:lines,logo:logo};ids.forEach(function(i){o[i]=$(i).value});return o}
function save(){try{localStorage.setItem(KEY,JSON.stringify(snap()))}catch(e){}}
function apply(o){type=o.type||type;lines=o.lines||lines;logo=o.logo||"";ids.forEach(function(i){if(o[i]!=null)$(i).value=o[i]})}
function load(){try{var s=localStorage.getItem(KEY);if(s)apply(JSON.parse(s))}catch(e){}}
function kidOf(n,m){var d=("000000"+(String(n).replace(/\D/g,"")||"0")).slice(-8),sum=0,i,k;
  if(m==="11"){var w=[2,3,4,5,6,7];for(i=d.length-1,k=0;i>=0;i--,k++)sum+=+d[i]*w[k%6];var c=11-sum%11;if(c===11)c=0;if(c===10)return null;return d+c}
  for(i=d.length-1,k=0;i>=0;i--,k++){var v=+d[i]*(k%2===0?2:1);sum+=v>9?v-9:v}return d+((10-sum%10)%10)}
var nok=function(n){return n.toLocaleString("nb-NO",{minimumFractionDigits:2,maximumFractionDigits:2})+" kr"};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var fd=function(v){if(!v)return"";var p=v.split("-");return p[2]+"."+p[1]+"."+p[0]};
function drawLines(){
  var h="";lines.forEach(function(l,i){h+='<div class="line"><input class="d" data-i="'+i+'" data-k="d" value="'+esc(l.d)+'" placeholder="Beskrivelse" aria-label="Beskrivelse"><input data-i="'+i+'" data-k="q" type="number" step="any" value="'+l.q+'" aria-label="Antall"><input data-i="'+i+'" data-k="u" value="'+esc(l.u)+'" aria-label="Enhet"><input data-i="'+i+'" data-k="p" type="number" step="any" value="'+l.p+'" aria-label="Pris"><button class="x" data-del="'+i+'" aria-label="Fjern linje">×</button></div>'});
  $("lines").innerHTML=h;
}
function render(){
  var rate=+$("mva").value/100,inkl=$("vis").value==="inkl",net=0;
  var rows=lines.map(function(l){var p=+l.p||0,q=+l.q||0,pn=inkl?p/(1+rate):p,sum=pn*q;net+=sum;
    return '<tr><td>'+esc(l.d)+'</td><td class="r">'+q+' '+esc(l.u)+'</td><td class="r">'+nok(pn)+'</td><td class="r">'+nok(sum)+'</td></tr>'}).join("");
  var disc=net*Math.min(100,Math.max(0,+$("rabatt").value||0))/100,base=net-disc,mva=base*rate,tot=base+mva,fak=type==="Faktura";
  $("fristl").textContent=fak?"Forfallsdato":"Gyldig til";
  $("doc").innerHTML='<div class="top"><div>'+(logo?'<img src="'+logo+'" alt="" style="max-height:56px;max-width:170px;display:block;margin-bottom:8px">':'')+'<h3>'+type+' '+esc($("nr").value)+'</h3><small>Dato: '+fd($("dato").value)+'<br>'+(fak?"Forfall: ":"Gyldig til: ")+fd($("frist").value)+'</small></div>'
   +'<div style="text-align:right"><b>'+esc($("fnavn").value||"Ditt firmanavn")+'</b><br><small>'+esc($("fadr").value)+'<br>'+(($("forg").value)?"Org.nr "+esc($("forg").value)+"<br>":"")+esc($("ftlf").value)+'</small></div></div>'
   +'<div class="cols"><div><small>Til</small><br><b>'+esc($("knavn").value||"Kundens navn")+'</b><br>'+esc($("kadr").value)+'</div></div>'
   +'<table><thead><tr><th>Beskrivelse</th><th class="r">Antall</th><th class="r">Pris</th><th class="r">Sum</th></tr></thead><tbody>'+rows+'</tbody></table>'
   +'<div class="tot"><div><span>Sum eks. MVA</span><span>'+nok(net)+'</span></div>'+(disc>0?'<div><span>Rabatt</span><span>−'+nok(disc)+'</span></div>':'')+'<div><span>MVA '+(rate*100)+' %</span><span>'+nok(mva)+'</span></div><div class="big"><span>Å betale</span><span>'+nok(tot)+'</span></div></div>'
   +(fak&&$("fkonto").value?'<p><small>Betales til konto</small><br><b>'+esc($("fkonto").value)+'</b> · Merk betalingen med '+($("kid").value==="ja"?(kidOf($("nr").value,$("kidm").value)?'KID <b>'+kidOf($("nr").value,$("kidm").value)+'</b>':'<b>'+esc($("nr").value)+'</b> (MOD11 gir ugyldig KID for dette nummeret – bytt fakturanummer)'):esc($("nr").value))+'</p>':"")
   +'<div class="note">'+esc($("notat").value)+'</div>';
  lastTot=tot;save();
}
$("lines").addEventListener("input",function(e){var t=e.target,i=t.dataset.i;if(i==null)return;lines[i][t.dataset.k]=t.value;render()});
$("lines").addEventListener("click",function(e){var i=e.target.dataset.del;if(i==null)return;lines.splice(i,1);if(!lines.length)lines.push({d:"",q:1,u:"stk",p:0});drawLines();render()});
$("add").onclick=function(){lines.push({d:"",q:1,u:"t",p:0});drawLines();render()};
ids.forEach(function(i){$(i).addEventListener("input",render)});
$("seg").addEventListener("click",function(e){var t=e.target.dataset.t;if(!t)return;type=t;seg();render()});
function seg(){Array.prototype.forEach.call($("seg").children,function(b){b.classList.toggle("on",b.dataset.t===type)})}
$("print").onclick=function(){try{window.print()}catch(e){}$("msg").textContent="Skjer det ingenting? Bruk «Last ned» og velg PDF."};
function model(){var rate=+$("mva").value/100,inkl=$("vis").value==="inkl",net=0;
  var rows=lines.map(function(l){var p=+l.p||0,q=+l.q||0,pn=inkl?p/(1+rate):p,sum=pn*q;net+=sum;return{d:l.d,q:q,u:l.u,pn:pn,sum:sum}});
  var disc=net*Math.min(100,Math.max(0,+$("rabatt").value||0))/100,base=net-disc,mva=base*rate;
  return{rate:rate,rows:rows,net:net,disc:disc,mva:mva,tot:base+mva}}
function kidTxt(){if($("kid").value!=="ja")return"Merk betalingen med "+$("nr").value;var k=kidOf($("nr").value,$("kidm").value);return k?"KID: "+k:"Merk betalingen med "+$("nr").value}
var tx=function(v){return String(v==null?"":v).replace(/\u00a0/g," ")};
function loadImg(src){return new Promise(function(ok,no){var i=new Image();i.onload=function(){ok(i)};i.onerror=no;i.src=src})}
async function mkPDF(m){var J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw new Error("pdf");
  var d=new J({unit:"mm",format:"a4"}),L=18,R=192,y=20,fak=type==="Faktura",nr=$("nr").value;
  if(logo){try{var im=await loadImg(logo),h=14;d.addImage(logo,"PNG",L,y-6,h*im.width/im.height,h);y+=h-2}catch(e){}}
  d.setFont("helvetica","bold");d.setFontSize(22);d.text(type+" "+nr,L,y+6);
  d.setFont("helvetica","normal");d.setFontSize(10);d.setTextColor(100);
  d.text("Dato: "+fd($("dato").value),L,y+13);d.text((fak?"Forfall: ":"Gyldig til: ")+fd($("frist").value),L,y+18);
  d.setTextColor(0);d.setFont("helvetica","bold");d.text(tx($("fnavn").value||"Ditt firmanavn"),R,20,{align:"right"});d.setFont("helvetica","normal");
  [$("fadr").value,$("forg").value?"Org.nr "+$("forg").value:"",$("ftlf").value].filter(Boolean).forEach(function(l,i){d.text(tx(l),R,26+i*5,{align:"right"})});
  y=Math.max(y+26,50);d.setTextColor(100);d.text("Til",L,y);d.setTextColor(0);d.setFont("helvetica","bold");d.text(tx($("knavn").value||"Kundens navn"),L,y+5);d.setFont("helvetica","normal");d.text(tx($("kadr").value),L,y+10);y+=24;
  var head=function(){d.setFontSize(9);d.setTextColor(100);d.text("Beskrivelse",L,y);d.text("Antall",118,y,{align:"right"});d.text("Pris",152,y,{align:"right"});d.text("Sum",R,y,{align:"right"});d.setDrawColor(30);d.setLineWidth(.5);d.line(L,y+2,R,y+2);y+=8;d.setFontSize(10);d.setTextColor(0)};
  head();
  m.rows.forEach(function(r){var ls=d.splitTextToSize(tx(r.d),88);if(y+ls.length*5>270){d.addPage();y=20;head()}
    d.text(ls,L,y);d.text(r.q+" "+tx(r.u),118,y,{align:"right"});d.text(tx(nok(r.pn)),152,y,{align:"right"});d.text(tx(nok(r.sum)),R,y,{align:"right"});
    y+=ls.length*5+1;d.setDrawColor(220);d.setLineWidth(.2);d.line(L,y,R,y);y+=5});
  if(y>235){d.addPage();y=20}y+=4;
  var tl=function(a,b,bold){d.setFont("helvetica",bold?"bold":"normal");d.setFontSize(bold?12:10);d.text(a,130,y);d.text(tx(b),R,y,{align:"right"});y+=bold?7:6};
  tl("Sum eks. MVA",nok(m.net));if(m.disc>0)tl("Rabatt","-"+nok(m.disc));tl("MVA "+(m.rate*100)+" %",nok(m.mva));d.setDrawColor(30);d.setLineWidth(.5);d.line(130,y-3,R,y-3);y+=2;tl("Å betale",nok(m.tot),true);
  d.setFont("helvetica","normal");d.setFontSize(10);y+=6;
  if(fak&&$("fkonto").value){d.text("Betales til konto "+tx($("fkonto").value)+". "+tx(kidTxt()),L,y);y+=8}
  var nt=d.splitTextToSize(tx($("notat").value),R-L);if(y+nt.length*5>285){d.addPage();y=20}d.setTextColor(80);d.text(nt,L,y);
  return d.output("arraybuffer")}
async function mkDOCX(m){var D=window.docx;if(!D)throw new Error("docx");
  var fak=type==="Faktura",A=D.AlignmentType,cell=function(t,w,o){o=o||{};return new D.TableCell({width:{size:w,type:D.WidthType.PERCENTAGE},children:[new D.Paragraph({alignment:o.r?A.RIGHT:A.LEFT,children:[new D.TextRun({text:tx(t),bold:!!o.b,size:20,color:o.c})]})]})};
  var para=function(t,o){o=o||{};return new D.Paragraph({alignment:o.r?A.RIGHT:A.LEFT,spacing:{after:o.after==null?80:o.after},children:[new D.TextRun({text:tx(t),bold:!!o.b,size:o.s||22,color:o.c})]})};
  var ch=[];
  if(logo){try{var bin=atob(logo.split(",")[1]),u=new Uint8Array(bin.length),im=await loadImg(logo);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);ch.push(new D.Paragraph({children:[new D.ImageRun({data:u,transformation:{width:Math.round(50*im.width/im.height),height:50}})]}))}catch(e){}}
  ch.push(para(type+" "+$("nr").value,{b:1,s:44}),para("Dato: "+fd($("dato").value),{c:"6B7378",after:20}),para((fak?"Forfall: ":"Gyldig til: ")+fd($("frist").value),{c:"6B7378",after:240}));
  ch.push(para($("fnavn").value||"Ditt firmanavn",{b:1,after:20}));
  [$("fadr").value,$("forg").value?"Org.nr "+$("forg").value:"",$("ftlf").value].filter(Boolean).forEach(function(l){ch.push(para(l,{after:20}))});
  ch.push(para("Til",{c:"6B7378",after:20}),para($("knavn").value||"Kundens navn",{b:1,after:20}),para($("kadr").value,{after:240}));
  var rows=[new D.TableRow({tableHeader:true,children:[cell("Beskrivelse",46,{b:1,c:"6B7378"}),cell("Antall",16,{b:1,r:1,c:"6B7378"}),cell("Pris",19,{b:1,r:1,c:"6B7378"}),cell("Sum",19,{b:1,r:1,c:"6B7378"})]})];
  m.rows.forEach(function(r){rows.push(new D.TableRow({children:[cell(r.d,46),cell(r.q+" "+r.u,16,{r:1}),cell(nok(r.pn),19,{r:1}),cell(nok(r.sum),19,{r:1})]}))});
  ch.push(new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},rows:rows}),para("",{after:160}));
  ch.push(para("Sum eks. MVA: "+nok(m.net),{r:1,after:40}));if(m.disc>0)ch.push(para("Rabatt: -"+nok(m.disc),{r:1,after:40}));
  ch.push(para("MVA "+(m.rate*100)+" %: "+nok(m.mva),{r:1,after:120}),para("Å betale: "+nok(m.tot),{r:1,b:1,s:28,after:240}));
  if(fak&&$("fkonto").value)ch.push(para("Betales til konto "+$("fkonto").value+". "+kidTxt(),{after:200}));
  if($("notat").value)ch.push(para($("notat").value,{c:"505A5F"}));
  return D.Packer.toBlob(new D.Document({sections:[{children:ch}]}))}
function mkXLSX(m){if(!window.XLSX)throw new Error("xlsx");
  var a=[[type+" "+$("nr").value],["Dato",fd($("dato").value)],["Kunde",$("knavn").value],[],["Beskrivelse","Antall","Enhet","Pris eks. MVA","Sum eks. MVA"]];

function mkCSV(m){var q=function(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"'},o=[["Beskrivelse","Antall","Enhet","Pris eks. MVA","Sum eks. MVA"]];

  return"\ufeff"+o.map(function(r){return r.map(q).join(";")}).join("\r\n")}
function mkHTML(){var css=document.querySelector("style").textContent;return'<!DOCTYPE html><html lang="no"><head><meta charset="utf-8"><title>'+type+' '+esc($("nr").value)+'</title><style>'+css+'body{background:#fff;display:block}.doc{border:0;max-width:760px;margin:auto}</style></head><body><div class="doc">'+$("doc").innerHTML+'</div></body></html>'}

  var m=model(),base=type.toLowerCase()+"-"+(($("nr").value||"1").replace(/[^\w-]/g,"")),data;

  try{if(dls)await dls.save({filename:base+"."+f,data:data});else{var bl=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(bl),a=document.createElement("a");a.href=u;a.download=base+"."+f;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}$("msg").textContent=""}catch(e){if(!e||e.code!=="declined")$("msg").textContent="Kunne ikke laste ned. Prøv et annet format."}};
